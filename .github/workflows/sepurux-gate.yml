name: Sepurux Reliability Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write
  issues: write

jobs:
  reliability-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Sepurux SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install sepurux

      - name: Run reliability gate
        run: |
              python - <<'PY'
              import os
              import sys
              import time
              import httpx
              from sepurux import SepuruxClient

              def required_env(name: str) -> str:
                  value = (os.getenv(name) or "").strip()
                  if not value:
                      print(f"{name} is missing/empty")
                      sys.exit(1)
                  return value

              base_url = required_env("SEPURUX_API_BASE_URL").rstrip("/")
              api_key = required_env("SEPURUX_API_KEY")
              campaign_id = required_env("SEPURUX_CAMPAIGN_ID")
              trace_id = required_env("SEPURUX_TRACE_ID")
              project_id = (os.getenv("SEPURUX_PROJECT_ID") or "").strip() or None

              min_reliability = float((os.getenv("SEPURUX_MIN_RELIABILITY") or "80").strip())
              timeout_seconds = int((os.getenv("SEPURUX_TIMEOUT_SECONDS") or "600").strip())

              headers = {"X-API-Key": api_key}
              if project_id:
                  headers["X-Project-Id"] = project_id

              # Preflight checks: fail early if trace/campaign is wrong for this key/project
              for path in (f"/v1/traces/{trace_id}", f"/v1/campaigns/{campaign_id}"):
                  url = f"{base_url}{path}"
                  resp = httpx.get(url, headers=headers, timeout=30)
                  if resp.status_code >= 400:
                      print(f"Preflight failed: GET {url} -> {resp.status_code}")
                      print(resp.text)
                      sys.exit(1)

              client = SepuruxClient(
                  base_url=base_url,
                  api_key=api_key,
                  project_id=project_id,
              )

              try:
                  run_id = client.start_run(trace_id=trace_id, campaign_id=campaign_id)
              except httpx.HTTPStatusError as exc:
                  print(f"start_run failed: {exc.response.status_code} {exc.request.url}")
                  print(exc.response.text)
                  sys.exit(1)

              print(f"Started Sepurux run: {run_id}")

              terminal_success = {"completed", "success", "succeeded", "done"}
              terminal_failure = {"failed", "error", "cancelled"}
              deadline = time.time() + timeout_seconds
              latest = {"status": "unknown", "summary": {}}

              while time.time() < deadline:
                  latest = client.get_run(run_id)
                  status = str(latest.get("status", "")).lower()
                  print(f"Run status: {status}")
                  if status in terminal_success | terminal_failure:
                      break
                  time.sleep(5)
              else:
                  print(f"Run timed out after {timeout_seconds}s")
                  sys.exit(1)

              status = str(latest.get("status", "")).lower()
              if status in terminal_failure:
                  print(f"Run ended in failure state: {status}")
                  sys.exit(1)
              if status not in terminal_success:
                  print(f"Run ended in unknown non-success state: {status}")
                  sys.exit(1)

              summary = latest.get("summary") or {}
              score = None
              for key in ("reliability", "reliability_score", "score", "pass_rate"):
                  value = summary.get(key)
                  if isinstance(value, (int, float)):
                      score = float(value)
                      break

              if score is None:
                  print("Could not find a numeric reliability score in run summary.")
                  print(f"Summary payload: {summary}")
                  sys.exit(1)

              if score <= 1:
                  score *= 100.0

              print(f"Reliability score: {score:.2f} (threshold: {min_reliability:.2f})")
              if score < min_reliability:
                  sys.exit(1)
              PY

        env:
          SEPURUX_API_BASE_URL: https://app.sepurux.dev/api/backend
          SEPURUX_API_KEY: ${{ secrets.SEPURUX_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          SEPURUX_PROJECT_ID: ${{ secrets.SEPURUX_PROJECT_ID }} # optional but recommended
          SEPURUX_CAMPAIGN_ID: ${{ secrets.SEPURUX_CAMPAIGN_ID }}
          SEPURUX_TRACE_ID: ${{ secrets.SEPURUX_TRACE_ID }}

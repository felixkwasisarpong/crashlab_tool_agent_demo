name: Sepurux Reliability Gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  reliability-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Sepurux CLI
        run: pip install sepurux

      - name: Run reliability gate
        run: |
          sepurux run campaign \
            --project my-agent \
            --campaign core-reliability \
            --min-reliability 80 \
            --timeout 600 \
            --api-key ${{ secrets.SEPURUX_API_KEY }}
        env:
          SEPURUX_API_BASE_URL: http://app.sepurux.com/api/backend
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

name: Sepurux Reliability Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write
  issues: write

jobs:
  reliability-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run tests
        run: python -m pytest

      - name: Run Sepurux batch gate
        run: python scripts/sepurux_batch_gate.py

        env:
          SEPURUX_API_BASE_URL: ${{ secrets.SEPURUX_API_BASE_URL }}
          SEPURUX_API_KEY: ${{ secrets.SEPURUX_API_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          SEPURUX_PROJECT_ID: ${{ secrets.SEPURUX_PROJECT_ID }}
          SEPURUX_CAMPAIGN_ID: ${{ secrets.SEPURUX_CAMPAIGN_ID }}
          SEPURUX_TRACE_IDS: ${{ secrets.SEPURUX_TRACE_IDS }}
          SEPURUX_MIN_PASS_RATE: ${{ secrets.SEPURUX_MIN_PASS_RATE }}
          SEPURUX_MAX_UNSAFE: ${{ secrets.SEPURUX_MAX_UNSAFE }}
          SEPURUX_MAX_FAILURES: ${{ secrets.SEPURUX_MAX_FAILURES }}
          SEPURUX_TIMEOUT_SECONDS: ${{ secrets.SEPURUX_TIMEOUT_SECONDS }}
          SEPURUX_EXPECTED_ATTEMPTS: "50"
